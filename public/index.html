<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neurospicy – Selbsttests zur Neurodiversität</title>
  <meta name="description" content="Wissenschaftlich fundierte Selbsttests zu ADHS, Autismus, Dyslexie, Dyspraxie und Tics. Kein Ersatz für eine Diagnose.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>
    // Gespeichertes Farbschema vor dem ersten Zeichnen setzen (verhindert Aufblitzen)
    try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="sun"></span><span class="hill h1"></span><span class="hill h2"></span></div>
  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="Neurospicy – zur Übersicht">
      <img class="brand-mark" src="logo.svg" alt="" width="34" height="34">
      <span>Neuro<b>spicy</b></span>
    </button>
    <span class="top-right">
      <span class="top-note" id="topNote">Anonym · Nichts wird gespeichert</span>
      <button class="top-link" id="srcLink" type="button">Quellen</button>
      <button class="top-icon" id="langBtn" type="button">EN</button>
      <button class="top-icon" id="themeBtn" type="button"></button>
    </span>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <p id="footNote"></p>
    <p id="footCrisis"></p>
  </footer>
  <script src="data.js"></script>
  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
